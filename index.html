/* ============================================================
   ZENVRA INTELLIGENCE CORE
     ZTime  — Pakistan Standard Time (Asia/Karachi, UTC+05:00, no DST). Storage stays UTC; only DISPLAY is PKT.
     ZMKT   — market-wide intelligence from public Binance endpoints (funding, OI, long/short, order-book
              pressure, real liquidation stream, tiles/sectors/movers). Nothing is fabricated: when a source
              is unavailable the field is empty and the error is recorded.
     ZRobot — supervisor: derives the robot's operating state and component health from REAL conditions
              (feed age, REST outcomes, scanner cycles, learning jobs, orders) and keeps an activity log.
   ============================================================ */
const ZTime = (function(){
'use strict';
const TZ = 'Asia/Karachi', OFFSET_MS = 5*3600000;
let fmt = null; try { fmt = new Intl.DateTimeFormat('en-GB', { timeZone:TZ, hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' }); } catch(e){ fmt = null; }
function parts(d){
  if (fmt){ const o = {}; fmt.formatToParts(d).forEach(function(p){ o[p.type] = p.value; }); if (o.hour === '24') o.hour = '00'; return o; }
  const x = new Date(d.getTime() + OFFSET_MS), pad = function(n){ return String(n).padStart(2, '0'); };
  return { year:String(x.getUTCFullYear()), month:pad(x.getUTCMonth()+1), day:pad(x.getUTCDate()), hour:pad(x.getUTCHours()), minute:pad(x.getUTCMinutes()), second:pad(x.getUTCSeconds()) };
}
function asDate(d){ return d instanceof Date ? d : new Date(d); }
function stamp(d){ d = asDate(d); if (isNaN(d.getTime())) return '—'; const p = parts(d); return p.year + '-' + p.month + '-' + p.day + ' ' + p.hour + ':' + p.minute + ':' + p.second + ' PKT'; }
function long(d){ d = asDate(d); try { return new Intl.DateTimeFormat('en-PK', { timeZone:TZ, dateStyle:'medium', timeStyle:'medium' }).format(d) + ' PKT'; } catch(e){ return stamp(d); } }
function hoursPKT(d){ const p = parts(asDate(d)); return +p.hour + (+p.minute)/60 + (+p.second)/3600; }
function dateKey(d){ const p = parts(asDate(d)); return p.year + '-' + p.month + '-' + p.day; }
function pad2(n){ return String(n).padStart(2, '0'); }
function hhmm(h){ const x = ((h % 24) + 24) % 24, hh = Math.floor(x), mm = Math.round((x - hh)*60); return pad2(mm === 60 ? (hh+1) % 24 : hh) + ':' + pad2(mm === 60 ? 0 : mm); }
function utcRangeToPKT(startH, endH){ return hhmm(startH + 5) + '–' + hhmm(endH + 5); }
return { TZ:TZ, OFFSET_MS:OFFSET_MS, stamp:stamp, long:long, hoursPKT:hoursPKT, dateKey:dateKey, hhmm:hhmm, utcRangeToPKT:utcRangeToPKT };
})();

async function boot(){
  ensureShell();
  render(); // shows the dashboard's empty/loading state briefly while the coin universe loads
  syncBinanceServerTime(); // don't block boot on this — journal timestamps fall back to local clock until it resolves
  setInterval(syncBinanceServerTime, 10 * 60 * 1000); // re-sync periodically to correct for clock drift
  try { await ZBrain.init(); ZBrain.start(); await ZAI.init(); await ZOMS.init(); ZOMS.start(); try { ZRobot.importLog(await ZBrain.store.kvGet('robot:log')); } catch(e){} const qt = new URLSearchParams(location.search).get('tab'); if (qt && getNavTab(qt)) state.tab = qt; render(); } catch(e){ console.warn('Brain/AI/OMS init failed — continuing:', e); }
  await loadCoinUniverse(); // must resolve before anything that reads COINS
  try { zxStartFeeds(); } catch(e){}
  try { zxStartIntel(); } catch(e){ console.warn('intel start failed', e); }
  render();
  await fetchAllMarketData(); // wait for prices to exist before the sweep tries to analyze anything
  setInterval(fetchAllMarketData, REFRESH_MS);
  connectWS();
  setInterval(function(){ renderRibbon(); }, 1000);
  renderTerminalTicker();
  setInterval(renderTerminalTicker, 5000); // slower than the ribbon clock so the marquee CSS animation isn't restarted every second
  setInterval(function(){
    if (state.tab === 'dashboard') renderDashboard();
    else if (state.tab === 'signals') renderSignalsTab();
    else if (state.tab === 'scanner') renderScannerTab();
    else if (state.tab === 'market') renderMarketAnalysis();
  }, 5000); // keep live tabs fresh without a full re-render every second
  setInterval(function(){ if (state.tab === 'market') refreshMicrostructure().then(function(){ if (state.tab==='market') renderMarketAnalysis(); }); }, 15000); // order book / funding / OI refresh — only while the Market tab is open, to avoid unnecessary calls
  if (state.autoAnalyze) runAutoAnalyzeCycle(); // kick off immediately rather than waiting REFRESH_MS for the first sweep
  setInterval(function(){ if (state.autoAnalyze) runAutoAnalyzeCycle(); }, REFRESH_MS);
  setInterval(autoTrackJournalOutcomes, REFRESH_MS); // checks open trades against live price every cycle
  setInterval(pruneJournalToRetention, 6 * 60 * 60 * 1000); // re-check 3-month retention every 6 hours
  state.lastRefreshAt = binanceNow().toISOString();
  updateLastRefreshChip();
  setInterval(function(){ state.lastRefreshAt = binanceNow().toISOString(); updateLastRefreshChip(); }, REFRESH_MS);
}

try {
  boot();
} catch (e) {
  showBootError('Boot error: ' + e.message);
  console.error(e);
}
